<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Ejecutivo · EVE Control</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#001D3D;--navy2:#003566;--gold:#FFC300;--bg:#F3F5F9;--card:#fff;--txt:#1b2433;--mut:#6b778c;--ok:#1a9a5b;--warn:#e69500;--bad:#d64545;--line:#e3e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
.mono{font-family:'JetBrains Mono',monospace}
header{background:var(--navy);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
.hrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:19px;letter-spacing:.3px}h1 span{color:var(--gold)}
.sub{font-size:12px;color:#b9c6da}
select,input,button{font-family:inherit;font-size:14px}
select,input[type=text],input[type=password],input[type=date],input[type=month],input[type=number],textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
.btn{background:var(--gold);color:var(--navy);border:0;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border:1px solid #4a6288}
.btn.dark{background:var(--navy);color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:67px;z-index:15}
nav button{border:0;background:transparent;padding:9px 14px;border-radius:20px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--navy);color:var(--gold)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,29,61,.08)}
.kpi .lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--navy);margin:6px 0 2px}
.kpi .hint{font-size:12.5px;color:var(--mut)}
.kpi.gold{border-left:5px solid var(--gold)}.kpi.ok{border-left:5px solid var(--ok)}.kpi.bad{border-left:5px solid var(--bad)}.kpi.warn{border-left:5px solid var(--warn)}.kpi.blue{border-left:5px solid var(--navy2)}
h2{font-size:17px;color:var(--navy);margin:22px 0 10px}
h3{font-size:14.5px;color:var(--navy);margin-bottom:10px}
.lectura{background:#fff8e0;border:1px solid #ffe08a;border-radius:12px;padding:12px 16px;margin-bottom:14px;line-height:1.5}
.lectura b{color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:8px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:'JetBrains Mono',monospace;white-space:nowrap}
tr.tot td{font-weight:700;background:#f7f9fc;border-top:2px solid var(--navy)}
.bar{height:8px;border-radius:5px;background:#e9eef6;min-width:60px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy2)}
.bar.g i{background:var(--gold)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.45}
.tabs2{display:inline-flex;background:#e9eef6;border-radius:20px;padding:3px;margin-bottom:12px}
.tabs2 button{border:0;background:transparent;padding:7px 14px;border-radius:18px;font-weight:700;color:var(--mut);cursor:pointer}
.tabs2 button.on{background:var(--navy);color:var(--gold)}
details{border-bottom:1px solid var(--line)}summary{cursor:pointer;padding:11px 6px;display:flex;justify-content:space-between;gap:10px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}summary:before{content:'▸ ';color:var(--gold)}details[open] summary:before{content:'▾ '}
details table{margin:0 0 10px 18px;width:calc(100% - 18px)}
.chartbox{position:relative;height:300px}
.gauge{height:26px;border-radius:14px;background:#e9eef6;overflow:hidden;position:relative;margin:10px 0}
.gauge i{display:block;height:100%;transition:width .5s}
.gauge span{position:absolute;left:0;right:0;top:0;text-align:center;line-height:26px;font-weight:700;font-size:13px;color:#001D3D;mix-blend-mode:normal}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}
.pill.ok{background:#dff5e9;color:var(--ok)}.pill.warn{background:#fff0d1;color:var(--warn)}.pill.bad{background:#fbe0e0;color:var(--bad)}
#login{max-width:460px;margin:7vh auto;padding:0 16px}
#login .card{padding:26px}
#login h1{color:var(--navy);margin-bottom:4px}
#login label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 4px;text-transform:uppercase}
#login input,#login textarea{width:100%}
#login .row{display:flex;gap:8px;margin-top:16px}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.warnbar{background:#fff0d1;border:1px solid #f3cf7c;color:#7a5200;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px}
.rango{display:none;gap:6px;align-items:center}
/* El Reporte mensual tiene su propio selector de mes: el selector de periodo del encabezado (y sus fechas) solo se ve en las pestañas que lo usan. Se oculta sin quitar los elementos ni cambiar su valor. */
body.sin-periodo #selPeriodo,body.sin-periodo #rangoBox{display:none!important}
.pe-in{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.pe-in label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px;text-transform:uppercase}
@media(max-width:640px){.kpi .val{font-size:22px}nav{top:92px}}
.rm-imp-head{display:none}
.rm-dos{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:flex-start}
@media(max-width:900px){.rm-dos{grid-template-columns:1fr}}
@page{size:letter portrait;margin:1.2cm}
@media print{
  [hidden],.panel[hidden]{display:none!important}
  header .btn,nav,.noprint,button{display:none!important}
  header,nav{position:static}
  .panel{display:block!important;page-break-inside:avoid}
  body{background:#fff;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* Reporte mensual: solo el reporte, sin controles globales (nav, selector de periodo, botones) */
  body.imp-reporte .panel:not(#p-reporte),body.imp-reporte header,body.imp-reporte nav,body.imp-reporte #warns{display:none!important}
  body.imp-reporte main{max-width:none;margin:0;padding:0}
  #p-reporte .rm-imp-head{display:block;font-size:17px;font-weight:700;color:var(--navy);border-bottom:3px solid var(--gold);padding-bottom:6px;margin-bottom:12px}
  #p-reporte .card{box-shadow:none;border:1px solid var(--line);break-inside:avoid;page-break-inside:avoid}
  #p-reporte .grid{grid-template-columns:repeat(3,1fr);break-inside:avoid}
  #p-reporte .rm-dos{grid-template-columns:1fr}
  #p-reporte .rm-dos>div{break-inside:avoid;page-break-inside:avoid;min-width:0}
  #p-reporte .lectura,#p-reporte .warnbar,#p-reporte .note{break-inside:avoid}
  #p-reporte h2{break-after:avoid;page-break-after:avoid}
  #p-reporte h2:not(:first-of-type){break-before:page;page-break-before:always}
  #p-reporte h3{break-after:avoid;page-break-after:avoid}
  #p-reporte table{width:100%;max-width:100%;table-layout:auto;font-size:10.5px;break-inside:avoid;page-break-inside:avoid}
  #p-reporte th,#p-reporte td{padding:4px 5px;overflow-wrap:anywhere}
  #p-reporte th{font-size:9.5px;letter-spacing:.2px}
  #p-reporte td.n,#p-reporte th.n{white-space:nowrap}
  #p-reporte thead{display:table-header-group}
  #p-reporte tr{break-inside:avoid;page-break-inside:avoid}
  #p-reporte .kpi .val{font-size:17px}
}
</style>
</head>
<body class="sin-periodo">

<!-- ================= LOGIN / CONFIG ================= -->
<div id="login">
  <div class="card">
    <h1>EVE <span style="color:#c99700">Control</span> · Dashboard Ejecutivo</h1>
    <div class="sub" style="color:#6b778c">Solo lectura. No modifica ningún dato.</div>

    <div id="cfgBox" style="display:none">
      <label>Configuración de Firebase (copia el objeto firebaseConfig de js/config.js)</label>
      <textarea id="cfgText" rows="7" placeholder='{ apiKey: "...", authDomain: "...", projectId: "everplastic", ... }'></textarea>
      <div class="note">Se guarda solo en este navegador.</div>
    </div>

    <div id="userBox">
      <label>Usuario</label><input type="text" id="usr" placeholder="Admin" autocomplete="username">
      <label>Contraseña</label><input type="password" id="pwd" autocomplete="current-password">
    </div>
    <div class="row">
      <button class="btn dark" id="btnLogin" style="flex:1">Entrar</button>
      <button class="btn" id="btnDemo" style="flex:1">Ver demo</button>
    </div>
    <div class="note"><a href="#" id="lnkCfg">Cambiar configuración de Firebase</a></div>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
<header>
  <div class="hrow">
    <div>
      <h1>EVE <span>Control</span> · Dashboard Ejecutivo</h1>
      <div class="sub" id="subTitle">—</div>
    </div>
    <div class="hrow noprint" style="gap:8px">
      <select id="selPeriodo">
        <option value="mes">Este mes</option>
        <option value="mesant">Mes anterior</option>
        <option value="90">Últimos 90 días</option>
        <option value="anio">Este año</option>
        <option value="todo">Todo el histórico</option>
        <option value="rango">Rango de fechas…</option>
      </select>
      <label class="noprint" style="display:flex;align-items:center;gap:4px;color:#fff;font-size:13px;cursor:pointer"><input type="checkbox" id="chkSocios"> Incluir material de socios (solo importes)</label>
      <span id="tagSocios" style="display:none;background:#e69500;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600">importes sin material de socios</span>
      <span class="rango" id="rangoBox"><input type="date" id="fDesde"><input type="date" id="fHasta"></span>
      <button class="btn ghost" id="btnRef">↻ Actualizar</button>
      <button class="btn ghost" onclick="imprimirConGraficas()">🖨 Imprimir</button>
      <button class="btn ghost" id="btnSalir">Salir</button>
    </div>
  </div>
</header>
<nav id="nav">
  <button data-p="reporte" class="on">📅 Reporte mensual</button>
  <button data-p="materiales">♻️ Materiales</button>
  <button data-p="ventas">💰 Ventas</button>
  <button data-p="inventario">📦 Inventario</button>
  <button data-p="cxp">🏭 Por pagar (CxP)</button>
  <button data-p="cxc">🤝 Por cobrar (CxC)</button>
  <button data-p="pe">⚖️ Punto de equilibrio</button>
</nav>
<main>
  <div id="warns"></div>
  <section class="panel on" id="p-reporte">
    <div class="card noprint" style="display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:14px">
      <div><label for="rmMes" style="display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase">Mes</label><input type="month" id="rmMes"></div>
      <button class="btn dark" id="rmImprimir">🖨 Imprimir</button>
    </div>
    <div id="rmCuerpo"></div>
  </section>
  <section class="panel" id="p-materiales"></section>
  <section class="panel" id="p-ventas"></section>
  <section class="panel" id="p-inventario"></section>
  <section class="panel" id="p-cxp"></section>
  <section class="panel" id="p-cxc"></section>
  <section class="panel" id="p-pe"></section>
</main>
</div>

<script>
/* ======================================================================
   CONFIGURACIÓN
   - Nombres de colecciones de Firestore (ajusta aquí si alguna difiere)
   - FIREBASE_CONFIG: déjalo en null para pegarlo desde la pantalla de entrada
   ====================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCF_6UdCStIo2eq-BSDH-vHmSu6LvzX7gU",
  authDomain: "everplastic.firebaseapp.com",
  projectId: "everplastic",
  storageBucket: "everplastic.firebasestorage.app",
  messagingSenderId: "804807980304",
  appId: "1:804807980304:web:47466f961871b5b0a80c06"
};
const COLS = {
  destaraje:'destaraje', cxp:'cuentas_por_pagar', ventas:'ventas',
  cxc:'cuentas_por_cobrar', cobros:'cobros', pagos:'pagos', gastos:'gastos',
  invIni:'inventario_inicial', inv:'inventario', prod:'control_produccion', precios:'precios', flujo:'flujo_movimientos',
  proveedores:'proveedores', clientes:'clientes'
};
const UNIDAD_PZ = /^(CAJA|TAMBO)/i;           // productos que se venden por pieza
const SUFIJO_USUARIO = '@everplastic.local';
// Interruptor de acceso. El correo de CORREOS_PERMITIDOS (admin, en minúsculas) entra siempre, sin consultar nada. Cualquier otro usuario (y el modo demo)
// entra solo si DASHBOARD_PUBLICO es true (apertura forzada por archivo; se conserva en false) o si el documento config/dashboard_ejecutivo de Firestore
// tiene abierto === true (interruptor de EVE Control → Admin → Config). Sin documento, con error o con cualquier otro valor: cerrado. A un usuario no
// permitido se le cierra la sesión y no se lee ninguna colección de datos (solo ese documento).
const DASHBOARD_PUBLICO = false;
const CORREOS_PERMITIDOS = ['admin@everplastic.local'];
const MSG_EN_REVISION = '🛠 En mantenimiento. Estamos validando las cifras del dashboard. Lo habilitaremos en cuanto sean confiables.';
const esCorreoAdmin = email => CORREOS_PERMITIDOS.some(c => String(c).toLowerCase() === String(email||'').trim().toLowerCase());
const correoPermitido = email => DASHBOARD_PUBLICO || esCorreoAdmin(email);
// Lee ÚNICAMENTE config/dashboard_ejecutivo con el usuario autenticado. true solo si el documento existe y abierto es exactamente true;
// ante cualquier error, documento inexistente o valor distinto devuelve false (cerrado por defecto) y deja el error en consola.
async function leerEstadoSocios(){
  try{
    const d=await (db||firebase.firestore()).collection('config').doc('dashboard_ejecutivo').get();
    const datos=d&&d.exists?d.data():null;
    return !!datos&&datos.abierto===true;
  }catch(e){ console.error('No se pudo leer config/dashboard_ejecutivo (se asume cerrado):',e); return false; }
}
// ¿Puede entrar este usuario? Admin: siempre (sin leer el documento). Otro: DASHBOARD_PUBLICO o interruptor abierto. Demo: mismo criterio (sin ser admin).
async function accesoPermitido(email,demo){
  if(!demo&&esCorreoAdmin(email)) return true;
  if(DASHBOARD_PUBLICO) return true;
  return await leerEstadoSocios();
}
// Interruptor del inventario: en false se oculta la pestaña, su panel y toda cifra de inventario del tablero. El código y calc() se conservan.
const MOSTRAR_INVENTARIO = false;
// Interruptor del punto de equilibrio: en false se oculta la pestaña, su panel y la tarjeta. peCalc, peParams, rPE y R.cfAuto/R.mcAuto se conservan.
const MOSTRAR_PUNTO_EQUILIBRIO = false;
// Colecciones que solo alimentan el inventario (calc() las usa únicamente en el cálculo de inventario y en R.precioMat, que solo valúa inventario).
// Con el interruptor en false no se leen: DB[k]=[] y sin aviso de colección no leída. 'destaraje' NO está aquí: R.kgBascula (Materiales) la usa.
const COLS_SOLO_INVENTARIO = ['invIni','inv','prod','precios'];
const omitirLectura = k => !MOSTRAR_INVENTARIO && COLS_SOLO_INVENTARIO.includes(k);
if(!MOSTRAR_INVENTARIO){
  const bi=document.querySelector('nav button[data-p="inventario"]'), pi=document.getElementById('p-inventario');
  if(bi) bi.hidden=true;
  if(pi) pi.hidden=true;
}
if(!MOSTRAR_PUNTO_EQUILIBRIO){
  const be=document.querySelector('nav button[data-p="pe"]'), pe_=document.getElementById('p-pe');
  if(be) be.hidden=true;
  if(pe_) pe_.hidden=true;
}

/* ======================================================================
   UTILIDADES
   ====================================================================== */
const $ = id => document.getElementById(id);
const num = x => { const n = parseFloat(x); return isFinite(n) ? n : 0; };
const fmt$ = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('es-MX',{maximumFractionDigits:0});
const fmt$2 = n => '$' + n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN = (n,d=0) => n.toLocaleString('es-MX',{maximumFractionDigits:d});
const fmtPct = n => (isFinite(n)?n:0).toFixed(0)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fdate = s => { if(!s) return ''; const p=String(s).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s; };
const norm = s => String(s||'').trim().toUpperCase();
// Material: misma normalización que normalizarMaterial de EVE Control (js/config.js): espacios colapsados, mayúsculas y alias → nombre canónico.
// Tabla copiada en línea de window.MATERIALES_ALIAS (el Ejecutivo no carga js/config.js). Si cambia allá, actualizarla aquí (scripts/verificar-paridad-material.js lo vigila).
const MATERIALES_ALIAS = {'CRISTAL CON ETIQ':'CRISTAL CON ETIQUETA','CRISTAL SIN ETIQ':'CRISTAL SIN ETIQUETA','MULTI-LECHERO':'MULTILECHERO','MIXTO2':'MIXTO 2','MULTICOLOR':'MULTI-COLOR','GARRAFA':'BIDON','PEAD':'DURO','P.E..':'P.E.','P.P MOLIDO':'P.P. MOLIDO','POLIETILENO':'P.E.','POLIPROPILENO':'P.P.','POLIETILENO MOLIDO':'P.E. MOLIDO','POLIPROPILENO MOLIDO':'P.P. MOLIDO','POLIETILENO PELETIZADO':'P.E. PELETIZADO','POLIPROPILENO PELETIZADO':'P.P. PELETIZADO','GARRAFA MOLIDA':'BIDON MOLIDO'};
const normMat = s => { const l=String(s==null?'':s).trim().replace(/\s+/g,' ').toUpperCase(); return Object.prototype.hasOwnProperty.call(MATERIALES_ALIAS,l)?MATERIALES_ALIAS[l]:l; };
const PROVEEDORES_SOCIOS = ['GERMAN','MARIO M'];
const limpiaSocio = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
function esProveedorSocio(nombre){ const k=limpiaSocio(nombre); return !!k && PROVEEDORES_SOCIOS.some(s=>limpiaSocio(s)===k); }
// Interruptor de material de socios: SIEMPRE arranca excluido al abrir; no se lee ninguna elección guardada de sesiones anteriores.
// Cambia solo en memoria durante la sesión (el checkbox lo actualiza); la clave vieja se borra para que no quede rastro.
let INCLUIR_SOCIOS=false;
try{ localStorage.removeItem('dash_incluir_socios'); }catch(e){}
function incluirSocios(){ return INCLUIR_SOCIOS; }
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const mesLbl = k => MESES[+k.slice(5,7)-1]+' '+k.slice(2,4);
const dayDiff = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

let DB = null, DEMO = false, db = null, auth = null, charts = {};
let PER = {desde:'',hasta:'',label:''};
const HOY = iso(new Date());

function grp(arr, keyF, valF){            // agrupa y suma varios campos
  const m = {};
  arr.forEach(x=>{ const k=keyF(x); if(!k) return; const v=valF(x); const o=m[k]||(m[k]={}); for(const f in v) o[f]=(o[f]||0)+v[f]; });
  return m;
}
function chart(id, cfg){
  if(charts[id]) charts[id].destroy();
  const el=$(id); if(!el) return;
  charts[id]=new Chart(el.getContext('2d'),cfg);
}
/* Impresión de gráficas. Causa de las gráficas en blanco: renderAll() crea TODAS las gráficas mientras su pestaña está oculta
   (.panel{display:none}); con responsive:true Chart.js mide 0×0 y dibuja en un canvas vacío. Al imprimir, @media print vuelve
   visibles los paneles, pero Chart.js aún no remide (ResizeObserver) y la animación de 1 s no ha pintado: sale el hueco en blanco.
   Solución: antes de imprimir cada gráfica se redibuja sin animación y con tamaño fijo, y se reemplaza por una imagen de su canvas;
   en afterprint se restauran las interactivas. Idempotente: la llama el botón y el evento beforeprint (Ctrl+P). */
const IMP_ANCHO=680, IMP_ALTO=300;
let impGraficas=null;
function prepararGraficasParaImprimir(){
  if(impGraficas) return impGraficas.imgs;           // ya preparadas (botón + beforeprint)
  impGraficas={items:[],imgs:[]};
  Object.keys(charts).forEach(id=>{
    try{
      const ch=charts[id], canvas=ch&&ch.canvas, padre=canvas&&canvas.parentNode;
      if(!ch||!canvas||!padre) return;
      const item={id,ch,canvas,display:canvas.style.display,responsive:ch.options.responsive,animation:ch.options.animation,img:null};
      impGraficas.items.push(item);                  // se registra antes de tocar la gráfica: así siempre se restaura
      ch.options.animation=false; ch.options.responsive=false;
      ch.resize(IMP_ANCHO,IMP_ALTO); ch.update('none');
      const url=typeof ch.toBase64Image==='function'?ch.toBase64Image():canvas.toDataURL('image/png');
      const img=document.createElement('img');
      img.className='chart-imp'; img.alt='Gráfica'; img.src=url;
      img.style.cssText='display:block;width:100%;height:'+IMP_ALTO+'px;object-fit:contain';
      canvas.style.display='none'; padre.appendChild(img);
      item.img=img; impGraficas.imgs.push(img);
    }catch(e){ /* una gráfica sin datos o con error no debe frenar la impresión: se imprime su contenedor */ }
  });
  return impGraficas.imgs;
}
function restaurarGraficasDespuesDeImprimir(){
  const est=impGraficas; if(!est) return; impGraficas=null;
  let falla=false;
  est.items.forEach(it=>{
    try{
      if(it.img&&it.img.parentNode) it.img.parentNode.removeChild(it.img);
      it.canvas.style.display=it.display||'';
      it.ch.options.animation=it.animation; it.ch.options.responsive=it.responsive;
      it.ch.update('none'); it.ch.resize();
    }catch(e){ falla=true; }
  });
  if(falla){ try{ renderAll(); }catch(e){} }         // último recurso: vuelve a crear las gráficas interactivas
}
function imprimirConGraficas(){
  const imgs=prepararGraficasParaImprimir();
  const listo=imgs.map(i=>typeof i.decode==='function'?i.decode().catch(()=>{}):null);
  Promise.all(listo).then(()=>window.print(),()=>window.print());
}
window.addEventListener('beforeprint',prepararGraficasParaImprimir);
window.addEventListener('afterprint',restaurarGraficasDespuesDeImprimir);

function parseCfg(txt){
  const out={}; const re=/["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g; let m;
  while((m=re.exec(txt))) out[m[1]]=m[2];
  return out.apiKey&&out.projectId?out:null;
}

// Bloqueo de acceso (usuario no admin con el interruptor cerrado): cierra la sesión, oculta la app y muestra el aviso en la pantalla de acceso. No lee Firestore.
async function bloquearAcceso(){
  try{ if(auth) await auth.signOut(); }catch(e){}
  DB=null;
  $('app').style.display='none';
  $('login').style.display='';
  $('loginErr').textContent=MSG_EN_REVISION;
}
// Sesión que el navegador ya trae guardada al cargar la página: si no es admin lee el interruptor y, si está cerrado, se cierra de inmediato (sin leer colecciones).
function revisarSesionGuardada(){
  if(DASHBOARD_PUBLICO) return;
  try{
    const cfg=getCfg(); if(!cfg) return;
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    auth=firebase.auth();
    const dejar=auth.onAuthStateChanged(async u=>{ dejar(); if(u && !(await accesoPermitido(u.email,false))) bloquearAcceso(); });
  }catch(e){}
}

async function arrancar(){
  if(!(await accesoPermitido(auth && auth.currentUser && auth.currentUser.email,DEMO))){ await bloquearAcceso(); return; }
  $('login').style.display='none'; $('app').style.display='block';
  $('subTitle').textContent = DEMO?'MODO DEMO · datos ficticios':'Conectado · '+(auth&&auth.currentUser?auth.currentUser.email:'');

}

async function cargarYRender(accesoYaComprobado){
  // Actualizar vuelve a comprobar el interruptor: si un socio ya está dentro y se cerró, se le cierra la sesión y no se lee ninguna colección.
  if(!accesoYaComprobado && !(await accesoPermitido(auth && auth.currentUser && auth.currentUser.email,DEMO))){ await bloquearAcceso(); return; }
  $('warns').innerHTML='<div class="warnbar">Cargando datos…</div>';
  if(DEMO){ DB=demoData(); COL_FALLAS=['proveedores','clientes']; $('warns').innerHTML=''; }
  else{
    const keys=Object.keys(COLS);
    const res=await Promise.allSettled(keys.map(k=>omitirLectura(k)?Promise.resolve(null):db.collection(COLS[k]).get()));
    DB={}; const fails=[];
    res.forEach((r,i)=>{
      const k=keys[i];
      if(omitirLectura(k)){ DB[k]=[]; return; }
      if(r.status==='fulfilled') DB[k]=r.value.docs.map(d=>({id:d.id,...d.data()}));
      else{ DB[k]=[]; fails.push(COLS[k]); }
    });
    COL_FALLAS=fails;
    $('warns').innerHTML = fails.length?`<div class="warnbar">⚠️ No se pudieron leer estas colecciones (permisos o nombre distinto): <b>${fails.join(', ')}</b>. Los números que dependen de ellas aparecerán en cero.</div>`:'';
  }
  renderAll();
}

/* ======================================================================
   CÁLCULOS
   ====================================================================== */
function calc(){
  const D=DB, R={};
  // --- Compras de material (CxP generadas en el periodo)
  const esSI=c=>c.tipo==='saldo_inicial'||(c.aprobacion&&c.aprobacion.tipo==='saldo_inicial');
  const verSocio=c=>incluirSocios()||!esProveedorSocio(c.proveedor); // interruptor de socios (solo vista)
  const cxpCompras=D.cxp.filter(c=>!esSI(c)&&verSocio(c)); // saldo inicial no es compra
  const cxpP=cxpCompras.filter(c=>inP(c.fechaTicket));
  R.compras=grp(cxpP,c=>normMat(c.material),c=>({kg:num(c.kg),monto:num(c.total)}));
  R.comprasMonto=sum(Object.values(R.compras),x=>x.monto);
  // Kg: SIEMPRE de la báscula (destaraje, todos los tickets, socios y pendientes incluidos); el interruptor de socios nunca los filtra.
  const basculaP=D.destaraje.filter(r=>inP(r.fechaSalida||r.fechaEntrada));
  R.kgBasculaMat=grp(basculaP,r=>normMat(r.material),r=>({kg:num(r.kg)}));
  R.kgBascula=sum(basculaP,r=>num(r.kg));
  // Kg con cuenta por pagar: TODAS las CxP del periodo (sin filtro de socios, sin saldo inicial), por material.
  R.kgCxpMat=grp(D.cxp.filter(c=>!esSI(c)&&inP(c.fechaTicket)),c=>normMat(c.material),c=>({kg:num(c.kg)}));
  R.kgSinCxpMat={};
  new Set(Object.keys(R.kgBasculaMat).concat(Object.keys(R.kgCxpMat))).forEach(m=>{ R.kgSinCxpMat[m]=(R.kgBasculaMat[m]?R.kgBasculaMat[m].kg:0)-(R.kgCxpMat[m]?R.kgCxpMat[m].kg:0); });
  R.kgSinCxp=sum(Object.values(R.kgSinCxpMat),x=>x);
  // --- Ventas del periodo (por línea)
  const lin=[]; D.ventas.filter(v=>inP(v.fecha)).forEach(v=>(v.lineas||[]).forEach(l=>lin.push({...l,cliente:v.cliente,fecha:v.fecha})));
  R.ventasLin=lin;
  R.ventas=grp(lin,l=>normMat(l.material),l=>({cant:num(l.cantidad),monto:l.subtotal!=null?num(l.subtotal):num(l.cantidad)*num(l.precioUnitario)}));
  R.ventasUnidad={}; lin.forEach(l=>R.ventasUnidad[normMat(l.material)]=l.unidad||(UNIDAD_PZ.test(l.material)?'PZ':'KG'));
  R.ventasMonto=sum(Object.values(R.ventas),x=>x.monto);
  R.ivaVentas=sum(lin,l=>num(l.ivaTrasladado)-num(l.ivaRetenido));
  R.ventasKg=sum(Object.entries(R.ventas),([k,x])=>R.ventasUnidad[k]==='PZ'?0:x.cant);
  // --- Cobros, pagos y gastos del periodo
  // Cobrado sin IVA: parte del cobro que corresponde al subtotal de su CxC (o de la línea de venta). Así la retención de IVA no distorsiona.
  const cxcPorId={}; D.cxc.forEach(x=>cxcPorId[x.id]=x);
  const ventaPorId={}; D.ventas.forEach(v=>ventaPorId[v.id]=v);
  const cobroSinIva=c=>{
    if(c.pagado==null) return num(c.monto??c.cobrado??c.total);
    if(c.origen==='anticipo') return num(c.pagado); // anticipo de cliente: completo, sin restar iva ni prorratear (igual que js/utils.js)
    const pag=num(c.pagado), x=cxcPorId[c.cxcId];
    if(x&&num(x.total)>0){
      const sub=x.subtotal!=null?num(x.subtotal):num(x.total)-num(x.ivaTrasladado)+num(x.ivaRetenido||0);
      return pag*sub/num(x.total);
    }
    const v=ventaPorId[c.ventaId], l=v&&(v.lineas||[]).find(l=>normMat(l.material)===normMat(c.material));
    if(l&&num(l.totalLinea)>0){
      const sub=l.subtotal!=null?num(l.subtotal):num(l.cantidad)*num(l.precioUnitario);
      return pag*sub/num(l.totalLinea);
    }
    return pag-num(c.iva);
  };
  R.cobrado=sum(D.cobros.filter(c=>!c.revertido&&inP(c.fecha)),cobroSinIva);
  R.pagado=sum(D.pagos.filter(p=>!p.revertido&&inP(p.fecha)),p=>num(p.pagado??p.monto??p.total)-(p.origen==='anticipo'?0:num(p.iva||0))); // el anticipo a proveedor cuenta completo
  R.anticipos=sum(D.pagos.filter(p=>!p.revertido&&p.origen==='anticipo'&&inP(p.fecha)),p=>num(p.pagado??p.monto??p.total));
  // Rubros del flujo (los mismos que el módulo Flujo de efectivo): inversión, financiamiento u operación; el 'Saldo inicial' se ignora.
  const montoGasto=g=>g.montoBase!=null?num(g.montoBase):num(g.total??g.monto);
  const gastosP=D.gastos.filter(g=>inP(g.fecha));
  R.gastosFin=sum(gastosP.filter(g=>g.tipoGasto==='financiamiento'),montoGasto);
  R.gastosInv=sum(gastosP.filter(g=>g.tipoGasto==='inversion'),montoGasto);
  R.gastosOp=sum(gastosP.filter(g=>g.tipoGasto!=='financiamiento'&&g.tipoGasto!=='inversion'),montoGasto);
  R.gastos=R.gastosOp+R.gastosFin+R.gastosInv;
  const tipoNorm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  const TIPOS_FIN=['aportacion o prestamo','aportacion de socio','disposicion de credito','retiro o devolucion a socio','retiro de socio'];
  const TIPOS_ENTRADA=['entrada','otra entrada','anticipo de cliente','aportacion o prestamo','aportacion de socio','disposicion de credito'];
  const manuales=(D.flujo||[]).filter(m=>inP(m.fecha)&&tipoNorm(m.tipo)!=='saldo inicial');
  const esEntrada=m=>TIPOS_ENTRADA.includes(tipoNorm(m.tipo));
  const manInv=manuales.filter(m=>tipoNorm(m.tipo)==='inversion en activo');
  const manFin=manuales.filter(m=>TIPOS_FIN.includes(tipoNorm(m.tipo))), manOp=manuales.filter(m=>!TIPOS_FIN.includes(tipoNorm(m.tipo))&&tipoNorm(m.tipo)!=='inversion en activo');
  R.inversionManual=sum(manInv,m=>num(m.importe));
  R.inversion=R.gastosInv+R.inversionManual;
  R.financiamientoEntradas=sum(manFin.filter(esEntrada),m=>num(m.importe));
  R.financiamientoSalidas=sum(manFin.filter(m=>!esEntrada(m)),m=>num(m.importe))+R.gastosFin;
  R.otrosOperativos=sum(manOp.filter(esEntrada),m=>num(m.importe))-sum(manOp.filter(m=>!esEntrada(m)),m=>num(m.importe));
  R.manDet=manuales.map(m=>{const t=tipoNorm(m.tipo); return {rubro:t==='inversion en activo'?'inversion':TIPOS_FIN.includes(t)?'financiamiento':'operacion',k:t,tipo:String(m.tipo||'Sin tipo').trim(),entrada:esEntrada(m)?num(m.importe):0,salida:esEntrada(m)?0:num(m.importe)};});
  R.gastosDet=gastosP.map(g=>({rubro:g.tipoGasto==='inversion'?'inversion':g.tipoGasto==='financiamiento'?'financiamiento':'operacion',concepto:norm(g.concepto)||norm(g.beneficiario)||'GASTO',monto:montoGasto(g)}));
  R.flujoOperativo=R.cobrado-R.pagado-R.gastosOp+R.otrosOperativos;
  R.flujoFinanciamiento=R.financiamientoEntradas-R.financiamientoSalidas;
  R.flujoInversion=-R.inversion;
  R.flujo=R.flujoOperativo+R.flujoInversion+R.flujoFinanciamiento; // neto de efectivo (operativo + inversión + financiamiento)
  // --- Precios vigentes y costo promedio
  const costoProm=grp(cxpCompras,c=>normMat(c.material),c=>({kg:num(c.kg),m:num(c.total)}));
  R.precioMat=m=>{
    const ps=D.precios.filter(p=>normMat(p.material)===m&&String(p.fechaInicio)<=HOY&&(!p.fechaFin||String(p.fechaFin)>=HOY)).sort((a,b)=>String(b.fechaInicio).localeCompare(String(a.fechaInicio)));
    if(ps.length) return num(ps[0].precio);
    const c=costoProm[m]; return c&&c.kg>0?c.m/c.kg:null;
  };
  // --- Inventario actual (suma de todas las etapas, al día de hoy)
  const inv={}; R.invSrc={};
  const add=(m,kg,src,id,det)=>{m=normMat(m); if(!m) return; inv[m]=(inv[m]||0)+kg;
    const s=(R.invSrc[m]=R.invSrc[m]||{}); const o=(s[src]=s[src]||{kg:0,n:0,ids:[]}); o.kg+=kg; o.n++; if(o.ids.length<6) o.ids.push(id+(det?' ('+det+')':''));};
  D.invIni.forEach(r=>add(r.material,num(r.kg),'inventario_inicial',r.id,r.etapa));
  D.inv.forEach(r=>{ if(num(r.ajusteNeto)!==0) add(r.material,num(r.ajusteNeto),'inventario (ajustes)',r.id,r.etapa); });
  D.destaraje.forEach(r=>add(r.material,num(r.kg),'destaraje (báscula)',r.ticket||r.id));
  D.prod.forEach(p=>{ (p.inputs||[]).forEach(i=>add(i.material,-num(i.kg),'producción: consumos',p.ticket||p.id)); (p.outputs||[]).forEach(o=>{ if(!o.esMerma) add(o.material,num(o.kg),'producción: salidas',p.ticket||p.id); }); });
  D.ventas.forEach(v=>(v.lineas||[]).forEach(l=>add(l.material,-num(l.cantidad),'ventas',v.folio||v.id)));
  R.inv=Object.entries(inv).map(([m,kg])=>{const p=UNIDAD_PZ.test(m)?null:R.precioMat(m);return{m,kg:Math.round(kg*100)/100,pz:UNIDAD_PZ.test(m),precio:p,valor:p!=null?kg*p:null};})
    .filter(x=>Math.abs(x.kg)>0.005).sort((a,b)=>(b.valor||0)-(a.valor||0));
  R.invKg=sum(R.inv.filter(x=>!x.pz&&x.kg>0),x=>x.kg);
  R.invValor=sum(R.inv.filter(x=>x.valor!=null&&x.kg>0),x=>x.valor);
  R.invSinValuar=R.inv.filter(x=>x.valor==null&&x.kg>0).length;
  // --- CxP pendiente
  const pend=D.cxp.filter(c=>num(c.saldo)>0.01&&verSocio(c));
  R.cxpTotalConSocios=sum(D.cxp.filter(c=>num(c.saldo)>0.01),c=>num(c.saldo)); // no depende del interruptor de socios
  R.cxpLista=pend; R.cxpTotal=sum(pend,c=>num(c.saldo)); R.cxpSaldoInicial=sum(pend.filter(esSI),c=>num(c.saldo));
  R.cxpProv=grp(pend,c=>c.proveedor||'(sin proveedor)',c=>({saldo:num(c.saldo)}));
  R.cxpProvMat=grp(pend,c=>(c.proveedor||'(sin proveedor)')+'||'+normMat(c.material),c=>({saldo:num(c.saldo),kg:num(c.kg)}));
  R.cxpMat=grp(pend,c=>normMat(c.material),c=>({saldo:num(c.saldo)}));
  R.cxpAging=aging(pend,c=>c.fechaTicket,c=>num(c.saldo));
  // --- CxC pendiente
  const sCxc=c=>c.saldo!=null?num(c.saldo):num(c.total)-num(c.cobrado);
  const cp=D.cxc.filter(c=>sCxc(c)>0.01);
  R.cxcLista=cp; R.cxcTotal=sum(cp,sCxc);
  R.cxcCli=grp(cp,c=>c.cliente||'(sin cliente)',c=>({saldo:sCxc(c)}));
  R.cxcMat=grp(cp,c=>normMat(c.material)||'(varios)',c=>({saldo:sCxc(c)}));
  R.cxcAging=aging(cp,c=>c.fecha||c.fechaVenta,sCxc);
  R.sCxc=sCxc;
  // --- Tendencia mensual (últimos 6 meses)
  const meses=[]; const t=new Date(); for(let i=5;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1); meses.push(iso(d).slice(0,7));}
  R.meses=meses;
  R.serieVentas=meses.map(k=>sum(D.ventas.filter(v=>String(v.fecha).slice(0,7)===k),v=>sum(v.lineas||[],l=>l.subtotal!=null?num(l.subtotal):num(l.cantidad)*num(l.precioUnitario))));
  R.serieCompras=meses.map(k=>sum(cxpCompras.filter(c=>String(c.fechaTicket).slice(0,7)===k),c=>num(c.total)));
  // --- Punto de equilibrio
  const fijo=g=>/fij/i.test(String(g.clasificacion||g.tipo||g.tipoCosto||g.categoriaCosto||''));
  const gf=D.gastos.filter(fijo);
  const m3=meses.slice(3); // últimos 3 meses
  const cfAuto=gf.length? sum(gf.filter(g=>m3.includes(String(g.fecha).slice(0,7))),g=>g.montoBase!=null?num(g.montoBase):num(g.total??g.monto))/3 : 0;
  const v3=sum(R.serieVentas.slice(3),x=>x), c3=sum(R.serieCompras.slice(3),x=>x);
  let mcAuto=v3>0?1-c3/v3:0.30; mcAuto=Math.min(0.95,Math.max(0.05,mcAuto));
  R.cfAuto=Math.round(cfAuto); R.mcAuto=Math.round(mcAuto*100);
  return R;
}
function aging(arr,fechaF,valF){
  const b=[{l:'0-7 días',v:0},{l:'8-15 días',v:0},{l:'16-30 días',v:0},{l:'Más de 30 días',v:0}];
  arr.forEach(x=>{const d=dayDiff(String(fechaF(x)||HOY).slice(0,10),HOY); const i=d<=7?0:d<=15?1:d<=30?2:3; b[i].v+=valF(x);});
  return b;
}

/* ======================================================================
   REPORTE MENSUAL (pestaña propia: mes elegido, independiente del selector de periodo)
   Importes sin impuestos. Bloque 1: flujo de efectivo (puente saldo inicial + neto = saldo final).
   Bloque 2: material (entradas = compras CxP, salidas = ventas), no es efectivo.
   ====================================================================== */

  const PER0=PER, R0=R;                     // se restauran al terminar: el resto del tablero no se entera
  let Rm=null, Rf=null, Rprev=null;
  try{
    PER={desde,hasta,label:etiqueta}; Rm=calc();                         // mes completo (material)
    const d0=desde<FLUJO_INICIO?FLUJO_INICIO:desde;                      // el flujo solo cuenta desde FLUJO_INICIO
    if(hasta>=FLUJO_INICIO){
      if(d0===desde) Rf=Rm; else { PER={desde:d0,hasta,label:etiqueta}; Rf=calc(); }
      if(d0>FLUJO_INICIO){ PER={desde:FLUJO_INICIO,hasta:iso(new Date(y,m-1,0)),label:'previo'}; Rprev=calc(); }
    }
  } finally { PER=PER0; R=R0; }

  let html=`<div class="rm-imp-head">Reporte mensual para socios · ${esc(etiqueta)} (${fdate(desde)} al ${fdate(hasta)})</div><div class="lectura">📅 <b>Reporte mensual · ${esc(etiqueta)}</b> (${fdate(desde)} al ${fdate(hasta)}). Todos los importes son sin impuestos.</div>`;

  /* ---------- Bloque 1: flujo de efectivo ---------- */
  html+='<h2>1 · Flujo de efectivo</h2>';
  if(!Rf){
    html+=`<div class="note">El Flujo de efectivo inicia el ${fdate(FLUJO_INICIO)}; este mes es anterior y no tiene flujo.</div>`;
  } else {
    const d0=desde<FLUJO_INICIO?FLUJO_INICIO:desde;
    const man=DB.flujo||[];
    const esSIman=x=>tipoNormG(x.tipo)==='saldo inicial';
    const f10=x=>String(x.fecha||'').slice(0,10);
    const siPrevio=sum(man.filter(x=>esSIman(x)&&f10(x)>=FLUJO_INICIO&&f10(x)<d0),x=>num(x.importe));
    const siEnMes=sum(man.filter(x=>esSIman(x)&&f10(x)>=d0&&f10(x)<=hasta),x=>num(x.importe));
    const saldoIni=siPrevio+(Rprev?Rprev.flujo:0);

    // Operativo: cobros, pagos a proveedores (pagos sin IVA + anticipos + anticipos manuales del flujo, todo en una sola fila), gastos y movimientos manuales operativos
    const manR=r=>(Rf.manDet||[]).filter(x=>x.rubro===r);
    const gasR=r=>(Rf.gastosDet||[]).filter(x=>x.rubro===r).map(x=>({c:x.concepto,e:0,s:x.monto}));
    const manV=r=>manR(r).filter(x=>x.k!=='anticipo a proveedor').map(x=>({c:x.tipo,e:x.entrada,s:x.salida}));
    const antManual=sum(manR('operacion').filter(x=>x.k==='anticipo a proveedor'),x=>x.salida);
    const fijasOp=[
      {c:'Cobrado a clientes',e:Rf.cobrado,s:0},
      {c:'Pagos a proveedores',e:0,s:Rf.pagado+antManual}
    ];
    const op=rmTablaRubro('Operativo',rmFilasRubro(fijasOp,gasR('operacion').concat(manV('operacion')),6));
    const inv=rmTablaRubro('Inversión',rmFilasRubro([],gasR('inversion').concat(manV('inversion')),6));
    const fin=rmTablaRubro('Financiamiento',rmFilasRubro([],gasR('financiamiento').concat(manV('financiamiento')),6));

    const entradas=op.e+inv.e+fin.e, salidas=op.s+inv.s+fin.s, neto=entradas-salidas, saldoFin=saldoIni+siEnMes+neto;
    if(Math.abs(neto-Rf.flujo)>0.5) console.warn('Reporte mensual: el neto del desglose ('+neto+') no coincide con calc().flujo ('+Rf.flujo+')');

    html+=`<div class="grid g4" style="margin-bottom:12px">
      ${kpi('blue','Acumulado al inicio del mes',rmM(saldoIni),'Desde el arranque del flujo ('+fdate(FLUJO_INICIO)+')')}
      ${kpi('ok','Entradas',rmM(entradas),'Efectivo que entró')}
      ${kpi('bad','Salidas',rmM(salidas),'Efectivo que salió')}
      ${kpi(neto<0?'bad':'ok','Neto del mes',rmM(neto),'Entradas − salidas')}
      ${kpi(saldoFin<0?'bad':'gold','Acumulado al cierre del mes',rmM(saldoFin),'Desde el arranque del flujo ('+fdate(FLUJO_INICIO)+')')}
    </div>
    <div class="lectura">Puente: <b>${rmM(saldoIni)}</b> acumulado al inicio ${siEnMes?`+ <b>${rmM(siEnMes)}</b> saldo inicial capturado en el mes `:''}+ <b class="${neto<0?'neg':'pos'}">${rmM(neto)}</b> neto del mes = <b>${rmM(saldoFin)}</b> acumulado al cierre.<br>
    Neto = operativo <b>${rmM(op.e-op.s)}</b> + inversión <b>${rmM(inv.e-inv.s)}</b> + financiamiento <b>${rmM(fin.e-fin.s)}</b>.</div>
    ${desde<FLUJO_INICIO?`<div class="note">El flujo cuenta desde el ${fdate(FLUJO_INICIO)}; lo anterior no se incluye.</div>`:''}
    ${op.html}${inv.html}${fin.html}
    <div class="note">El flujo es efectivo de todos los proveedores y clientes: el interruptor «Incluir material de socios» no lo afecta.</div>`;
  }

  /* ---------- Bloque 2: material ---------- */
  // Dos tablas independientes (catálogos distintos: entran materiales, salen productos terminados); sin diferencias entre ellas.
  const entradas=Object.keys(Rm.kgBasculaMat).concat(Object.keys(Rm.compras)).filter((k,i,a)=>a.indexOf(k)===i).map(k=>({k,kg:Rm.kgBasculaMat[k]?Rm.kgBasculaMat[k].kg:0,monto:Rm.compras[k]?Rm.compras[k].monto:0}))
    .filter(x=>x.kg>0||x.monto>0).sort((a,b)=>b.kg-a.kg||b.monto-a.monto);
  const salidas=Object.keys(Rm.ventas).map(k=>{ const v=Rm.ventas[k], pz=Rm.ventasUnidad[k]==='PZ'; return {k,kg:pz?0:v.cant,pz:pz?v.cant:0,monto:v.monto}; })
    .filter(x=>x.kg>0||x.pz>0||x.monto>0).sort((a,b)=>b.monto-a.monto||b.kg-a.kg);
  const TE={kg:sum(entradas,x=>x.kg),monto:sum(entradas,x=>x.monto)};
  const TS={kg:sum(salidas,x=>x.kg),pz:sum(salidas,x=>x.pz),monto:sum(salidas,x=>x.monto)};
  const guion=(n,f)=>n>0?f(n):'—';
  const socios=incluirSocios();
  html+=`<h2>2 · Material: entradas y salidas del mes</h2>
  <div style="margin-bottom:10px"><span class="pill ${socios?'ok':'warn'}">Importes: material de socios ${socios?'incluido':'excluido'}</span>
    <span class="note" style="display:inline;margin-left:8px">El interruptor «Incluir material de socios» aplica solo a importes. Los kg de entradas son siempre los de la báscula completa.</span></div>
  <div class="card"><div class="rm-dos">
    <div><h3>Entradas de material</h3><table><thead><tr><th>Material</th><th class="n">Kg</th><th class="n">Importe</th></tr></thead><tbody>
    ${entradas.map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${fmtN(x.kg)}</td><td class="n">${guion(x.monto,rmM)}</td></tr>`).join('')||'<tr><td colspan="3" class="note">Sin movimientos en el mes</td></tr>'}
    ${entradas.length?`<tr class="tot"><td>TOTAL</td><td class="n">${fmtN(TE.kg)}</td><td class="n">${rmM(TE.monto)}</td></tr>`:''}</tbody></table></div>
    <div><h3>Salidas de producto terminado</h3><table><thead><tr><th>Producto</th><th class="n">Kg</th><th class="n">Piezas</th><th class="n">Importe</th></tr></thead><tbody>
    ${salidas.map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${guion(x.kg,n=>fmtN(n))}</td><td class="n">${guion(x.pz,n=>fmtN(n))}</td><td class="n">${rmM(x.monto)}</td></tr>`).join('')||'<tr><td colspan="4" class="note">Sin movimientos en el mes</td></tr>'}
    ${salidas.length?`<tr class="tot"><td>TOTAL</td><td class="n">${fmtN(TS.kg)}</td><td class="n">${fmtN(TS.pz)}</td><td class="n">${rmM(TS.monto)}</td></tr>`:''}</tbody></table></div>
  </div>
  <div class="note">Kg de entradas: báscula completa. Importe de entradas: cuenta por pagar, con el interruptor de socios aplicado. Salidas: ventas del mes sin IVA. Montos de material, no efectivo.</div></div>`;
  html+=rmBloqueCxP(desde,hasta,Rm);
  html+=rmBloqueCxC(desde,hasta,Rm);
  cuerpo.innerHTML=html;
  try{ autopruebaCxP(); autopruebaCxC(); }catch(e){ console.warn('Autoprueba CxP/CxC no se pudo ejecutar: '+e.message); }
}

function kpi(cls,lbl,val,hint){return `<div class="card kpi ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="hint">${hint||''}</div></div>`;}
function barRow(pct,cls=''){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;}

function peParams(){
  let s={}; try{s=JSON.parse(localStorage.getItem('eve_dash_pe')||'{}');}catch(e){}
  return {cf:s.cf!=null?s.cf:null, mc:s.mc!=null?s.mc:null};
}

// Conciliación contra los módulos: window.DIAG() en la consola. No toca la interfaz.
window.DIAG=function(){
  const D=DB, r2=x=>Math.round(x*100)/100;
  const cobP=D.cobros.filter(c=>!c.revertido&&inP(c.fecha));
  const gasP=D.gastos.filter(g=>inP(g.fecha));
  const cobBruto=sum(cobP,c=>c.pagado!=null?num(c.pagado):num(c.monto??c.cobrado??c.total));
  const cobIva=sum(cobP,c=>num(c.iva));
  const gasBase=sum(gasP,g=>g.montoBase!=null?num(g.montoBase):num(g.total??g.monto));
  const gasIva=sum(gasP,g=>num(g.iva));
  const lineasRet=R.ventasLin.filter(l=>num(l.ivaRetenido)>0);
  const filas=[
    ['Ventas sin IVA',R.ventasMonto],
    ['IVA neto de ventas',R.ivaVentas],
    ['Ventas con IVA',R.ventasMonto+R.ivaVentas],
    ['Cobros pagado bruto',cobBruto],
    ['IVA de cobros',cobIva],
    ['Cobrado sin IVA',R.cobrado],
    ['Saldo CxC (hoy, con IVA)',R.cxcTotal],
    ['Pagos totales',R.pagado],
    ['Anticipos',R.anticipos],
    ['Gastos montoBase',gasBase],
    ['IVA de gastos',gasIva],
    ['Gastos con IVA',gasBase+gasIva],
    ['Compras CxP',R.comprasMonto],
    ['IVA de pagos',sum(D.pagos.filter(p=>!p.revertido&&inP(p.fecha)),p=>num(p.iva))],
    ['Líneas de venta con retención de IVA',sum(lineasRet,l=>l.subtotal!=null?num(l.subtotal):num(l.cantidad)*num(l.precioUnitario)),lineasRet.length+' líneas'],
    ['Gastos de operación',R.gastosOp],
    ['Gastos de inversión',R.gastosInv],
    ['Gastos de financiamiento',R.gastosFin],
    ['Aportaciones y préstamos',R.financiamientoEntradas],
    ['Pagos de deuda y retiros',R.financiamientoSalidas,'incluye gastos de financiamiento'],
    ['Otros operativos',R.otrosOperativos],
    ['Flujo operativo',R.flujoOperativo],
    ['Flujo de financiamiento',R.flujoFinanciamiento],
    ['Flujo neto',R.flujo],
    ['Cobrado sin IVA (método anterior pagado - iva)',sum(cobP,c=>c.pagado!=null?num(c.pagado)-num(c.iva):num(c.monto??c.cobrado??c.total))]
  ].map(([concepto,monto,detalle])=>({concepto,monto:r2(monto),detalle:detalle||''}));
  console.log('DIAG · '+PER.label+' ('+PER.desde+' a '+PER.hasta+')');
  console.table(filas);
  const porConcepto={};
  gasP.forEach(g=>{
    const k=String(g.concepto||'').trim().replace(/\s+/g,' ').toUpperCase()||'(sin concepto)';
    const o=porConcepto[k]=porConcepto[k]||{concepto:k,montoBase:0,iva:0,registros:0};
    o.montoBase+=g.montoBase!=null?num(g.montoBase):num(g.total??g.monto); o.iva+=num(g.iva); o.registros++;
  });
  const gastosFilas=Object.values(porConcepto).sort((a,b)=>b.montoBase-a.montoBase)
    .map(o=>({concepto:o.concepto,montoBase:r2(o.montoBase),iva:r2(o.iva),registros:o.registros}));
  gastosFilas.push({concepto:'TOTAL',montoBase:r2(gasBase),iva:r2(gasIva),registros:gasP.length});
  console.log('DIAG · Gastos por concepto');
  console.table(gastosFilas);
  return filas;
};

/* ---------- PUNTO DE EQUILIBRIO (cálculo; lo usa rPE) ---------- */
function peCalc(){
  const p=peParams(); const cf=p.cf!=null?p.cf:R.cfAuto; const mc=(p.mc!=null?p.mc:R.mcAuto)/100;
  const pe=mc>0?cf/mc:0;
  const km=R.meses[5]; const ventasMes=R.serieVentas[5];
  return {cf,mc,pe,ventasMes,cob:pe>0?ventasMes/pe:0,km};
}

  </div>
  <div class="card" style="margin-top:14px"><h3>¿De dónde sale cada existencia? <small style="font-weight:400;color:#6b778c">(toca un material)</small></h3>
  ${rows.map(x=>{const s=R.invSrc[x.m]||{};return `<details><summary><span>${esc(x.m)}</span><span class="mono">${fmtN(x.kg,1)} ${x.pz?'pz':'kg'}</span></summary><table><thead><tr><th>Fuente (colección)</th><th class="n">Docs</th><th class="n">Kg</th><th>Ejemplos de ID</th></tr></thead><tbody>${Object.entries(s).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n ${v.kg<0?'neg':''}">${fmtN(v.kg,1)}</td><td style="font-size:12px;color:#6b778c">${esc(v.ids.join(', '))}</td></tr>`).join('')}</tbody></table></details>`;}).join('')}
  <div class="note">Si un material no debería existir, aquí ves en qué colección sigue guardado su registro. Bórralo en Firebase Console (Firestore → colección → documento) y pulsa ↻ Actualizar.</div></div>`;
  const top=rows.filter(x=>x.valor!=null&&x.valor>0).slice(0,12);
  chart('chInv',{type:'bar',data:{labels:top.map(x=>x.m),datasets:[{label:'$',data:top.map(x=>x.valor),backgroundColor:C_NAVY}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt$(c.raw)+' · '+fmtN(top[c.dataIndex].kg)+' kg'}}},scales:{x:{ticks:{callback:v=>fmt$(v)}}}}});
}

/* ---------- CxP ---------- */
let cxpVista='prov';
function rCxP(){
  const provs=Object.entries(R.cxpProv).sort((a,b)=>b[1].saldo-a[1].saldo);
  const mats=Object.entries(R.cxpMat).sort((a,b)=>b[1].saldo-a[1].saldo);
  const top=provs[0];
  let lista='';
  if(cxpVista==='prov'){
    lista=provs.map(([p,x])=>{
      const det=Object.entries(R.cxpProvMat).filter(([k])=>k.startsWith(p+'||')).map(([k,v])=>[k.split('||')[1],v]).sort((a,b)=>b[1].saldo-a[1].saldo);
      return `<details><summary><span>${esc(p)}</span><span class="mono">${fmt$(x.saldo)}</span></summary><table><thead><tr><th>Material</th><th class="n">Kg</th><th class="n">Saldo</th></tr></thead><tbody>${det.map(([m,v])=>`<tr><td>${esc(m)}</td><td class="n">${fmtN(v.kg)}</td><td class="n">${fmt$(v.saldo)}</td></tr>`).join('')}</tbody></table></details>`;}).join('');
  }else{
    lista=mats.map(([m,x])=>{
      const det=Object.entries(R.cxpProvMat).filter(([k])=>k.endsWith('||'+m)).map(([k,v])=>[k.split('||')[0],v]).sort((a,b)=>b[1].saldo-a[1].saldo);
      return `<details><summary><span>${esc(m)}</span><span class="mono">${fmt$(x.saldo)}</span></summary><table><thead><tr><th>Proveedor</th><th class="n">Kg</th><th class="n">Saldo</th></tr></thead><tbody>${det.map(([p,v])=>`<tr><td>${esc(p)}</td><td class="n">${fmtN(v.kg)}</td><td class="n">${fmt$(v.saldo)}</td></tr>`).join('')}</tbody></table></details>`;}).join('');
  }
  const vencido=R.cxpAging[3].v+R.cxpAging[2].v;
  $('p-cxp').innerHTML=`
  <div class="lectura">🏭 <b>Cuentas por pagar al día de hoy:</b> debemos <b>${fmt$(R.cxpTotal)}</b> a <b>${provs.length}</b> proveedores.${R.cxpSaldoInicial>0?` <small>(de los cuales saldo inicial: <b>${fmt$(R.cxpSaldoInicial)}</b>)</small>`:''}
  ${top?`El mayor saldo es con <b>${esc(top[0])}</b> (${fmt$(top[1].saldo)}, ${fmtPct(top[1].saldo/R.cxpTotal*100)}).`:''}
  ${vencido>0?`<b>${fmt$(vencido)}</b> tienen más de 15 días de antigüedad.`:''}</div>
  <div class="grid g2">
    <div class="card"><h3>Saldo por proveedor (Top 10)</h3><div class="chartbox"><canvas id="chCxp"></canvas></div></div>
    <div class="card"><h3>Antigüedad del saldo</h3><div class="chartbox"><canvas id="chCxpAg"></canvas></div></div>
  </div>
  <h2>Detalle <small style="font-weight:400;color:#6b778c">(toca para desplegar)</small></h2>
  <div class="card">
    <div class="tabs2"><button class="${cxpVista==='prov'?'on':''}" onclick="cxpVista='prov';rCxP()">Por proveedor → material</button><button class="${cxpVista==='mat'?'on':''}" onclick="cxpVista='mat';rCxP()">Por material → proveedor</button></div>
    ${lista||'<div class="note">Sin saldos pendientes 🎉</div>'}
    <details open style="border:0"><summary style="border-top:2px solid var(--navy);margin-top:6px"><span>TOTAL GLOBAL</span><span class="mono">${fmt$(R.cxpTotal)}</span></summary></details>
  </div>`;
  const t10=provs.slice(0,10);
  chart('chCxp',{type:'bar',data:{labels:t10.map(x=>x[0]),datasets:[{label:'$',data:t10.map(x=>x[1].saldo),backgroundColor:C_RED}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt$(c.raw)}}},scales:{x:{ticks:{callback:v=>fmt$(v)}}}}});
  chart('chCxpAg',{type:'doughnut',data:{labels:R.cxpAging.map(b=>b.l),datasets:[{data:R.cxpAging.map(b=>b.v),backgroundColor:[C_GREEN,C_GOLD,'#e69500',C_RED]}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>c.label+': '+fmt$(c.raw)}}}}});
}

/* ---------- CxC ---------- */
function rCxC(){
  const cli=Object.entries(R.cxcCli).sort((a,b)=>b[1].saldo-a[1].saldo);
  const max=Math.max(1,...cli.map(c=>c[1].saldo));
  const venc=R.cxcAging[3].v+R.cxcAging[2].v;
  $('p-cxc').innerHTML=`
  <div class="lectura">🤝 <b>Cuentas por cobrar al día de hoy:</b> nos deben <b>${fmt$(R.cxcTotal)}</b> en <b>${cli.length}</b> clientes.
  ${cli[0]?`El mayor deudor es <b>${esc(cli[0][0])}</b> (${fmt$(cli[0][1].saldo)}, ${fmtPct(cli[0][1].saldo/R.cxcTotal*100)}).`:''}
  ${venc>0?`<b>${fmt$(venc)}</b> llevan más de 15 días sin cobrarse.`:''}
  ${R.cxcTotal>0&&R.cxpTotalConSocios>0?` Cobrando todo cubrimos <b>${fmtPct(R.cxcTotal/R.cxpTotalConSocios*100)}</b> de lo que debemos (incluye socios).`:''}</div>
  <div class="grid g2">
    <div class="card"><h3>Saldo por cliente</h3><table><thead><tr><th>Cliente</th><th class="n">Saldo</th><th>Peso</th></tr></thead><tbody>
    ${cli.map(([c,x])=>`<tr><td>${esc(c)}</td><td class="n">${fmt$(x.saldo)}</td><td style="width:120px">${barRow(x.saldo/max*100,'g')}</td></tr>`).join('')||'<tr><td colspan="3">Sin saldos pendientes 🎉</td></tr>'}
    <tr class="tot"><td>TOTAL</td><td class="n">${fmt$(R.cxcTotal)}</td><td></td></tr></tbody></table></div>
    <div class="card"><h3>Antigüedad del saldo</h3><div class="chartbox"><canvas id="chCxcAg"></canvas></div></div>
  </div>`;
  chart('chCxcAg',{type:'doughnut',data:{labels:R.cxcAging.map(b=>b.l),datasets:[{data:R.cxcAging.map(b=>b.v),backgroundColor:[C_GREEN,C_GOLD,'#e69500',C_RED]}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>c.label+': '+fmt$(c.raw)}}}}});
}

/* ---------- PUNTO DE EQUILIBRIO ---------- */
function rPE(){
  const p=peParams(), P=peCalc();
  const t=new Date(), diasMes=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(), dia=t.getDate(), resta=diasMes-dia;
  const falta=Math.max(0,P.pe-P.ventasMes), req=resta>0?falta/resta:falta;
  const ritmo=dia>0?P.ventasMes/dia*diasMes:0;
  const cls=P.pe<=0?'':P.cob>=1?'ok':P.cob>=.7?'warn':'bad';
  const color=cls==='ok'?C_GREEN:cls==='warn'?'#e69500':C_RED;
  $('p-pe').innerHTML=`
  <div class="lectura">⚖️ <b>¿Cuánto hay que vender al mes para no perder?</b> Es el monto de ventas donde los ingresos igualan a los costos.
  Por debajo se pierde dinero; por encima se gana. Se calcula: <b>Costos fijos ÷ Margen de contribución</b>.</div>
  <div class="card noprint"><h3>Supuestos (editables)</h3>
    <div class="pe-in">
      <div><label>Costos fijos mensuales ($)</label><input type="number" id="inCf" value="${P.cf}" min="0" step="1000" style="width:170px"></div>
      <div><label>Margen de contribución (%)</label><input type="number" id="inMc" value="${Math.round(P.mc*100)}" min="1" max="99" style="width:120px"></div>
      <button class="btn dark" id="btnPe">Recalcular</button>
      <button class="btn" id="btnPeAuto" style="background:#e9eef6">Usar valores automáticos</button>
    </div>
    <div class="note">Costos fijos automáticos: ${R.cfAuto>0?'promedio de los últimos 3 meses en Gastos clasificados como Fijo → <b>'+fmt$(R.cfAuto)+'</b>':'no hay gastos clasificados como Fijo; captúralos aquí (nómina, renta, luz, combustible, mantenimiento, arrendamientos, préstamos, depreciación).'}<br>
    Margen automático: <b>${R.mcAuto}%</b>, estimado como 1 − (compras de material ÷ ventas) de los últimos 3 meses. Es una aproximación: ajústalo con tu costeo variable real.</div>
  </div>
  <h2>${MESES[t.getMonth()]} ${t.getFullYear()} · mes en curso</h2>
  <div class="grid g4">
    ${kpi('blue','Meta de ventas (PE)',P.pe>0?fmt$(P.pe):'—','Para cubrir costos fijos')}
    ${kpi('gold','Vendido en el mes',fmt$(P.ventasMes),'Día '+dia+' de '+diasMes)}
    ${kpi(cls||'blue',P.ventasMes>=P.pe&&P.pe>0?'Ganancia sobre equilibrio':'Falta para equilibrio',P.pe>0?fmt$(Math.abs(P.ventasMes-P.pe)):'—',P.ventasMes>=P.pe&&P.pe>0?'✅ Ya cubrimos costos fijos':(resta>0?'Equivale a '+fmt$(req)+' por día restante':'Mes cerrado'))}
    ${kpi('blue','Ritmo proyectado',fmt$(ritmo),'Si se mantiene el ritmo actual')}
  </div>
  <div class="card" style="margin-top:14px"><h3>Avance hacia el equilibrio</h3>
    <div class="gauge"><i style="width:${Math.min(100,P.cob*100)}%;background:${color}"></i><span>${P.pe>0?fmtPct(P.cob*100)+' de la meta':'Captura costos fijos'}</span></div>
    <div class="note">${P.pe>0?(ritmo>=P.pe?'🟢 Al ritmo actual se cierra el mes por encima del equilibrio.':'🔴 Al ritmo actual el mes cerraría por debajo del equilibrio por '+fmt$(P.pe-ritmo)+'.'):''}</div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Ventas vs. punto de equilibrio · 6 meses</h3><div class="chartbox"><canvas id="chPe"></canvas></div></div>`;
  $('btnPe').onclick=()=>{localStorage.setItem('eve_dash_pe',JSON.stringify({cf:num($('inCf').value),mc:Math.min(99,Math.max(1,num($('inMc').value)))}));renderAll();showTab('pe');};
  $('btnPeAuto').onclick=()=>{localStorage.removeItem('eve_dash_pe');renderAll();showTab('pe');};
  chart('chPe',{data:{labels:R.meses.map(mesLbl),datasets:[
    {type:'bar',label:'Ventas',data:R.serieVentas,backgroundColor:R.serieVentas.map(v=>P.pe>0&&v<P.pe?C_RED:C_GREEN)},
    {type:'line',label:'Punto de equilibrio',data:R.meses.map(()=>P.pe),borderColor:C_NAVY,borderDash:[6,4],pointRadius:0,borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt$(c.raw)}}},scales:{y:{ticks:{callback:v=>fmt$(v)}}}}});
}

/* ---------- NAV ---------- */
function showTab(p){
  if(p==='pe'&&!MOSTRAR_PUNTO_EQUILIBRIO) return; // pestaña oculta: no se puede abrir (clic, atajo o llamada)
  document.body.classList.toggle('sin-periodo',p==='reporte'); // el selector de periodo no aplica al Reporte mensual
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.panel').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));
  Object.values(charts).forEach(c=>c.resize());
}
$('nav').onclick=e=>{const b=e.target.closest('button'); if(b) showTab(b.dataset.p);};

/* ======================================================================
   DATOS DEMO (ficticios, para ver cómo luce sin conectarse)
   ====================================================================== */
function demoData(){
  let s=7; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const mats=[['CRISTAL SIN ETIQUETA',9.2],['CRISTAL CON ETIQUETA',8.1],['LECHERO',6.8],['SUERO',5.4],['MIXTO',6.5],['P.E.',7.9],['P.P.',8.6],['MULTI-COLOR',4.3]];
  const provs=['FELIX LOZANO','ARTURO LARA','JESÚS','GUSTAVO','FRANCISCO','RECICLADOS DEL BAJÍO','MARIO RAMOS'];
  const clientes=['PLASTICOS DEL CENTRO','ENVASES MX','AGRO SAN LUIS','QUÍMICA POTOSINA','DISTRIBUIDORA NORTE'];
  const prods=[['CRISTAL SIN ETIQUETA',13.5,'KG'],['LECHERO MOLIDO',11,'KG'],['POLIETILENO PELETIZADO',17,'KG'],['SUERO',7,'KG'],['CAJA CO30',58,'PZ'],['TAMBO',300,'PZ']];
  const D={destaraje:[],cxp:[],ventas:[],cxc:[],cobros:[],pagos:[],gastos:[],invIni:[],inv:[],prod:[],precios:[],flujo:[]};
  const hoy=new Date(); const d0=n=>iso(new Date(hoy.getTime()-n*86400000));
  mats.forEach(([m,p])=>D.precios.push({material:m,precio:p,fechaInicio:'2026-01-01',fechaFin:null}));
  let tk=1000;
  for(let i=170;i>=0;i--){ const n=1+Math.floor(rnd()*3);
    for(let j=0;j<n;j++){ const [m,p]=pick(mats), kg=Math.round(300+rnd()*1500), f=d0(i), pr=pick(provs); tk++;
      D.destaraje.push({ticket:String(tk),proveedor:pr,material:m,kg,fechaEntrada:f,fechaSalida:f});
      const total=Math.round(kg*p*100)/100, pagado=rnd()<(i>20?.92:.35)?total:Math.round(total*rnd()*.5);
      D.cxp.push({ticket:String(tk),proveedor:pr,material:m,kg,fechaTicket:f,total,pagado,saldo:total-pagado});
      if(pagado>0) D.pagos.push({fecha:f,monto:pagado,proveedor:pr}); } }
  for(let i=170;i>=0;i--){ if(rnd()<.55){ const lineas=[]; const nl=1+Math.floor(rnd()*2);
      for(let k=0;k<nl;k++){ const [m,p,u]=pick(prods); const c=u==='PZ'?Math.round(40+rnd()*260):Math.round(800+rnd()*3500); lineas.push({material:m,cantidad:c,unidad:u,precioUnitario:p,subtotal:Math.round(c*p)}); }
      const tot=sum(lineas,l=>l.subtotal), cl=pick(clientes), f=d0(i), cob=rnd()<(i>25?.9:.3)?tot:0;
      D.ventas.push({folio:'V-2026-'+i,cliente:cl,fecha:f,lineas,totalVenta:tot});
      D.cxc.push({cliente:cl,fecha:f,material:lineas[0].material,total:tot,cobrado:cob,saldo:tot-cob});
      if(cob>0) D.cobros.push({fecha:f,monto:cob,cliente:cl}); } }
  for(let i=5;i>=0;i--){ const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,5);
    [['Nómina',180000],['Renta',45000],['Luz',38000],['Combustible',22000],['Mantenimientos',25000]].forEach(([c,m])=>D.gastos.push({fecha:iso(d),concepto:c,total:m,clasificacion:'Fijo'})); }
  mats.forEach(([m])=>D.invIni.push({material:m,kg:Math.round(2000+rnd()*4000)}));
  D.prod.push({inputs:[{material:'MIXTO',kg:5000}],outputs:[{material:'CRISTAL SIN ETIQUETA',kg:2600},{material:'LECHERO',kg:500},{material:'BASURA',kg:250,esMerma:true}],fechaFin:d0(10)});
  return D;
}
